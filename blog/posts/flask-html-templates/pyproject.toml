[project]
name = "flask-html-templates"
version = "0.1.0"
description = "Flask app demonstrating HTML templates."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "flask",
    "web-applications",
    "url",
    "html-templates",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "flask>=3.0",
]

[project.scripts]
flask-html-templates = "flask_html_templates.app:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flask_html_templates"]
include = ["templates/*.html"]

[tool.hatch.build.targets.sdist]
include = ["src/flask_html_templates", "tests", "README.md", "pyproject.toml", "templates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/flask_html_templates/*.py" = ["T201"]
"tests/*.py" = ["S101"]
