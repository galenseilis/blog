[project]
name = "what-are-ranks"
version = "0.1.0"
description = "Compare the rank transforms available in scipy.stats.rankdata on a small sample."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "statistics",
    "ranks",
    "rank-based-statistics",
    "binomial",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
]

[project.scripts]
what-are-ranks = "what_are_ranks.rank_table:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/what_are_ranks"]

[tool.hatch.build.targets.sdist]
include = ["src/what_are_ranks", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/what_are_ranks/*.py" = ["T201"]
"tests/*.py" = ["S101"]
