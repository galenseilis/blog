[project]
name = "moose-ou-fp"
version = "0.1.0"
description = "Fokker-Planck and analytic solutions of the Ornstein-Uhlenbeck moose movement model."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "fokker-planck",
    "ornstein-uhlenbeck",
    "movement-ecology",
    "finite-volume",
    "stochastic-processes",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.scripts]
moose-ou-fp = "moose_ou_fp.fokker_planck:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moose_ou_fp"]

[tool.hatch.build.targets.sdist]
include = ["src/moose_ou_fp", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/moose_ou_fp/*.py" = ["T201", "PLR0915", "PLR0912", "PLR0913", "N803", "N806"]
"tests/*.py" = ["S101"]
