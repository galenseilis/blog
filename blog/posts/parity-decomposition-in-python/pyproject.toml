[project]
name = "parity-decomposition-in-python"
version = "0.1.0"
description = "Parity decomposition plots of scalar functions in Python."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "mathematics",
    "parity",
    "function-parity-decomposition",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.scripts]
parity-decomposition = "parity_decomposition_in_python.parity:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parity_decomposition_in_python"]

[tool.hatch.build.targets.sdist]
include = ["src/parity_decomposition_in_python", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/parity_decomposition_in_python/*.py" = ["T201"]
"tests/*.py" = ["S101"]
