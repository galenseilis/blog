[project]
name = "music-word-adjacency-graph-silent-noon"
version = "0.1.0"
description = "Word adjacency graph of Rossetti's Silent Noon."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "word-adjacency",
    "networkx",
    "graph",
    "poetry",
    "natural-language-processing",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "matplotlib>=3.8",
    "networkx>=3.0",
]

[project.scripts]
music-word-adjacency-graph-silent-noon = "music_word_adjacency_graph_silent_noon.plot_word_adjacency:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_word_adjacency_graph_silent_noon"]

[tool.hatch.build.targets.sdist]
include = ["src/music_word_adjacency_graph_silent_noon", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/music_word_adjacency_graph_silent_noon/*.py" = ["T201", "PLR0915", "PLR0912", "PLR0913", "N803", "N806"]
"tests/*.py" = ["S101"]
