[project]
name = "ciw-simpy-bank-renege"
version = "0.1.0"
description = "A Ciw implementation of SimPy's Bank Renege example."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "discrete-event-simulation",
    "queueing-networks",
    "ciw",
    "reneging",
    "mm1-queue",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "ciw>=3.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.scripts]
ciw-simpy-bank-renege = "ciw_simpy_bank_renege.runtime:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ciw_simpy_bank_renege"]

[tool.hatch.build.targets.sdist]
include = ["src/ciw_simpy_bank_renege", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/ciw_simpy_bank_renege/*.py" = ["T201", "PLR0915", "PLR0912", "PLR0913", "N803", "N806"]
"tests/*.py" = ["S101"]
