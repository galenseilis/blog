[project]
name = "car-process-interaction-simpy-ciw"
version = "0.1.0"
description = "A Ciw implementation of SimPy's car example with process interaction."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = ["simulation", "discrete-event-simulation", "python", "ciw", "simpy"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = ["simpy", "ciw"]

[project.scripts]
car-process-interaction-simpy-ciw = "car_process_interaction_simpy_ciw.ciw_example:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/car_process_interaction_simpy_ciw"]

[tool.hatch.build.targets.sdist]
include = ["src/car_process_interaction_simpy_ciw", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/car_process_interaction_simpy_ciw/*.py" = ["T201", "PLR0915", "PLR0912", "PLR0913", "N803", "N806"]
"tests/*.py" = ["S101"]
