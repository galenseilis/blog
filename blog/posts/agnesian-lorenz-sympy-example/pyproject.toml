[project]
name = "agnesian-lorenz-sympy-example"
version = "0.1.0"
description = "Compute Agnesian order 1 for the Lorenz system using SymPy."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "sympy",
    "lorenz-system",
    "differential-equations",
    "agnesian",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy>=1.12",
]

[project.scripts]
agnesian-lorenz-sympy-example = "agnesian_lorenz_sympy_example.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agnesian_lorenz_sympy_example"]

[tool.hatch.build.targets.sdist]
include = ["src/agnesian_lorenz_sympy_example", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/agnesian_lorenz_sympy_example/*.py" = ["T201", "N803", "N806"]
"tests/*.py" = ["S101"]
