[project]
name = "dkwm-inequality-sample-size"
version = "0.1.0"
description = "Taylor expansion for the DKW(M) inequality sample-size bound."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "dkwm",
    "dkwe",
    "inequality",
    "statistics",
    "nonparametric",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.scripts]
dkwm-taylor = "dkwm_inequality_sample_size.taylor:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dkwm_inequality_sample_size"]

[tool.hatch.build.targets.sdist]
include = ["src/dkwm_inequality_sample_size", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/dkwm_inequality_sample_size/*.py" = ["T201"]
"tests/*.py" = ["S101"]
