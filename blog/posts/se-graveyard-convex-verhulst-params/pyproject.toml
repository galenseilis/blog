[project]
name = "se-graveyard-convex-verhulst-params"
version = "0.1.0"
description = "Symbolic Hessian of the Verhulst growth function in its parameters."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = ["sympy", "convexity", "verhulst", "logistic-growth"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = ["numpy", "sympy"]

[project.scripts]
se-graveyard-convex-verhulst-params = "se_graveyard_convex_verhulst_params.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/se_graveyard_convex_verhulst_params"]

[tool.hatch.build.targets.sdist]
include = ["src/se_graveyard_convex_verhulst_params", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/se_graveyard_convex_verhulst_params/*.py" = ["T201", "PLR0915", "PLR0912", "PLR0913", "N803", "N806"]
"tests/*.py" = ["S101"]
