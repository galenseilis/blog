[project]
name = "moose-ellipse"
version = "0.1.0"
description = "Reachable-ellipse geometry for locating a moose between GPS fixes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "movement-ecology",
    "gps-telemetry",
    "computational-geometry",
    "time-geography",
    "moose",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "shapely>=2.0",
]

[project.scripts]
moose-ellipse-reach = "moose_ellipse.reach:main"
moose-ellipse-shared-focus = "moose_ellipse.shared_focus:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moose_ellipse"]

[tool.hatch.build.targets.sdist]
include = ["src/moose_ellipse", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/moose_ellipse/*.py" = ["T201"]
"tests/*.py" = ["S101"]
