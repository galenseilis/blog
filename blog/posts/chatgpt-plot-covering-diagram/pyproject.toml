[project]
name = "chatgpt-plot-covering-diagram"
version = "0.1.0"
description = "ChatGPT's attempt at plotting the covering diagram of a partial order."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "chatgpt",
    "partial-order",
    "covering-diagram",
    "networkx",
    "plotting",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.8",
    "networkx>=3.0",
]

[project.scripts]
chatgpt-plot-covering-diagram = "chatgpt_plot_covering_diagram.full_example:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_plot_covering_diagram"]

[tool.hatch.build.targets.sdist]
include = ["src/chatgpt_plot_covering_diagram", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/chatgpt_plot_covering_diagram/*.py" = ["T201", "PLR0915", "PLR0912", "PLR0913", "N803", "N806"]
"tests/*.py" = ["S101"]
