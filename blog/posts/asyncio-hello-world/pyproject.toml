[project]
name = "asyncio-hello-world"
version = "0.1.0"
description = "A minimal asyncio \"Hello, World\" example that can be driven from a notebook."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "asyncio",
    "asynchronous-programming",
    "subprocess",
    "hello-world",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.scripts]
asyncio-hello-world = "asyncio_hello_world.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asyncio_hello_world"]

[tool.hatch.build.targets.sdist]
include = ["src/asyncio_hello_world", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/asyncio_hello_world/*.py" = ["T201"]
"tests/*.py" = ["S101"]
