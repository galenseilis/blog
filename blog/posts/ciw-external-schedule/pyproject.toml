[project]
name = "ciw-external-schedule"
version = "0.1.0"
description = "External schedule of Ciw simulations."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "ciw",
    "discrete-event-simulation",
    "queueing-networks",
    "scheduling",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "ciw>=2.3.0",
]

[project.scripts]
ciw-external-schedule = "ciw_external_schedule.example:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ciw_external_schedule"]

[tool.hatch.build.targets.sdist]
include = ["src/ciw_external_schedule", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/ciw_external_schedule/*.py" = ["T201", "PLR0915", "PLR0912", "PLR0913", "N803", "N806"]
"tests/*.py" = ["S101"]
