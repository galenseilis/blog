[project]
name = "ciw-implementation-of-machine-shop"
version = "0.1.0"
description = "Ciw implementation of SimPy's machine shop example."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = ["ciw", "simpy", "discrete-event-simulation", "queueing-networks"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["ciw>=2.3.0", "pandas>=2.0"]

[project.scripts]
ciw-implementation-of-machine-shop = "ciw_implementation_of_machine_shop.example:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ciw_implementation_of_machine_shop"]

[tool.hatch.build.targets.sdist]
include = ["src/ciw_implementation_of_machine_shop", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/ciw_implementation_of_machine_shop/*.py" = ["T201", "PLR0915", "PLR0912", "PLR0913", "N803", "N806"]
"tests/*.py" = ["S101"]
