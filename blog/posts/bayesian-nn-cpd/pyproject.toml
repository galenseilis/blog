[project]
name = "bayesian-nn-cpd"
version = "0.1.0"
description = "Toy Bayesian rank-1 CP decomposition example using PyMC."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "pymc",
    "bayesian",
    "tensor-decomposition",
    "cpd",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "arviz>=0.18",
    "numpy>=1.26",
    "pymc>=5.10",
]

[project.scripts]
bayesian-nn-cpd = "bayesian_nn_cpd.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bayesian_nn_cpd"]

[tool.hatch.build.targets.sdist]
include = ["src/bayesian_nn_cpd", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/bayesian_nn_cpd/*.py" = ["T201"]
"tests/*.py" = ["S101"]
