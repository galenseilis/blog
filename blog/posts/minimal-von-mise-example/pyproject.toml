[project]
name = "minimal-von-mise-example"
version = "0.1.0"
description = "Minimal von Mises example using PyMC."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "pymc",
    "bayesian",
    "von-mises",
    "circular-statistics",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "arviz>=0.18",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pymc>=5.10",
]

[project.scripts]
minimal-von-mise-example = "minimal_von_mise_example.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimal_von_mise_example"]

[tool.hatch.build.targets.sdist]
include = ["src/minimal_von_mise_example", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/minimal_von_mise_example/*.py" = ["T201"]
"tests/*.py" = ["S101"]
