[project]
name = "pandigital-factorial"
version = "0.1.0"
description = "Largest pandigital factorial number exploration."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "mathematics",
    "factorials",
    "pandigital",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "pandas>=2.0",
]

[project.scripts]
pandigital-factorial = "pandigital_factorial.pandigital:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pandigital_factorial"]

[tool.hatch.build.targets.sdist]
include = ["src/pandigital_factorial", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/pandigital_factorial/*.py" = ["T201", "PLR0915"]
"tests/*.py" = ["S101"]
