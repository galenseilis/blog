[project]
name = "paul-grogan-des"
version = "0.1.0"
description = "Paul Grogan's discrete-event simulation example, plus a Ciw implementation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = ["discrete-event-simulation", "simulation", "queueing"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = ["numpy", "ciw"]

[project.scripts]
paul-grogan-des = "paul_grogan_des.run:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paul_grogan_des"]

[tool.hatch.build.targets.sdist]
include = ["src/paul_grogan_des", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/paul_grogan_des/*.py" = ["T201", "PLR0915", "PLR0912", "PLR0913", "N803", "N806"]
"tests/*.py" = ["S101"]
