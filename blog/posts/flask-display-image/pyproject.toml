[project]
name = "flask-display-image"
version = "0.1.0"
description = "Flask app for displaying images fetched from URLs."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "flask",
    "web-applications",
    "requests",
    "images",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
]

[project.scripts]
flask-display-image = "flask_display_image.app:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flask_display_image"]

[tool.hatch.build.targets.sdist]
include = ["src/flask_display_image", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/flask_display_image/*.py" = ["T201"]
"tests/*.py" = ["S101"]
