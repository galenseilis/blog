[project]
name = "spearman-correlation"
version = "0.1.0"
description = "Permutation tables and grid figures for illustrating Spearman correlation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "statistics",
    "rank-based-statistics",
    "spearman-correlation",
    "permutations",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "tabulate>=0.9",
]

[project.scripts]
spearman-correlation-table = "spearman_correlation.permutations:main"
spearman-correlation-grid = "spearman_correlation.perm_grid:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spearman_correlation"]

[tool.hatch.build.targets.sdist]
include = ["src/spearman_correlation", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/spearman_correlation/*.py" = ["T201"]
"tests/*.py" = ["S101", "E402"]
