[project]
name = "moose-fp"
version = "0.1.0"
description = "Numerical solutions of general Fokker-Planck models of moose movement."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "fokker-planck",
    "fractional-diffusion",
    "movement-ecology",
    "finite-volume",
    "stochastic-processes",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
moose-fp-2d = "moose_fp.general_fp_2d:main"
moose-fp-beyond-gaussian = "moose_fp.beyond_gaussian_fp:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moose_fp"]

[tool.hatch.build.targets.sdist]
include = ["src/moose_fp", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/moose_fp/*.py" = ["T201", "PLR0915", "PLR0912", "PLR0913", "N803", "N806"]
"tests/*.py" = ["S101"]
