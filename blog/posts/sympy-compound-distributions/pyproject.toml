[project]
name = "sympy-compound-distributions"
version = "0.1.0"
description = "Build SymPy compound distributions with nested random variables."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "sympy",
    "statistics",
    "compound-distributions",
    "probability",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy>=1.12",
]

[project.scripts]
sympy-compound-distributions = "sympy_compound_distributions.compound:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sympy_compound_distributions"]

[tool.hatch.build.targets.sdist]
include = ["src/sympy_compound_distributions", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/sympy_compound_distributions/*.py" = ["T201"]
"tests/*.py" = ["S101"]
