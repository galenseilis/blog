[project]
name = "notes-process-modelling"
version = "0.1.0"
description = "A labelled transition system and its synchronous product, from notes on BPMAG's process-modelling lectures."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "process-modelling",
    "labelled-transition-systems",
    "synchronous-product",
    "discrete-event-simulation",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.scripts]
notes-process-modelling = "notes_process_modelling.example:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_process_modelling"]

[tool.hatch.build.targets.sdist]
include = ["src/notes_process_modelling", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/notes_process_modelling/*.py" = ["T201", "PLR0915", "PLR0912", "PLR0913", "N803", "N806"]
"tests/*.py" = ["S101"]
