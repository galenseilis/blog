[project]
name = "m-g-k-queue-ciw"
version = "0.1.0"
description = "Ciw implementation of an M/G/k queue."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "queueing-theory",
    "simulation",
    "discrete-event-simulation",
    "ciw",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "ciw>=2.3",
]

[project.scripts]
m-g-k-queue-ciw = "m_g_k_queue_ciw.queue:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m_g_k_queue_ciw"]

[tool.hatch.build.targets.sdist]
include = ["src/m_g_k_queue_ciw", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/m_g_k_queue_ciw/*.py" = ["T201"]
"tests/*.py" = ["S101"]
