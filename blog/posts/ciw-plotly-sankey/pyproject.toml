[project]
name = "ciw-plotly-sankey"
version = "0.1.0"
description = "Plotting Ciw's cafe example as a Sankey diagram using Plotly."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "discrete-event-simulation",
    "queueing-networks",
    "ciw",
    "plotly",
    "sankey-diagram",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "ciw>=3.0",
    "pandas>=2.0",
    "plotly>=5.0",
]

[project.scripts]
ciw-plotly-sankey = "ciw_plotly_sankey.render:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ciw_plotly_sankey"]

[tool.hatch.build.targets.sdist]
include = ["src/ciw_plotly_sankey", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/ciw_plotly_sankey/*.py" = ["T201", "PLR0915", "PLR0912", "PLR0913", "N803", "N806"]
"tests/*.py" = ["S101"]
