[project]
name = "server-socket-example"
version = "0.1.0"
description = "A minimal pickle-over-sockets client and server example."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "sockets",
    "networking",
    "client-server",
    "pickle",
    "serialization",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.scripts]
server-socket-example-server = "server_socket_example.server:main"
server-socket-example-client = "server_socket_example.client:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server_socket_example"]

[tool.hatch.build.targets.sdist]
include = ["src/server_socket_example", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/server_socket_example/*.py" = ["T201"]
"tests/*.py" = ["S101"]
