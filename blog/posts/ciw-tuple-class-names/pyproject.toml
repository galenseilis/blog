[project]
name = "ciw-tuple-class-names"
version = "0.1.0"
description = "Using tuples as customer-class names in Ciw queueing networks."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Galen Seilis" }]
keywords = [
    "discrete-event-simulation",
    "queueing-networks",
    "ciw",
    "tuples",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "ciw>=3.0",
]

[project.scripts]
ciw-tuple-class-names = "ciw_tuple_class_names.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ciw_tuple_class_names"]

[tool.hatch.build.targets.sdist]
include = ["src/ciw_tuple_class_names", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/ciw_tuple_class_names/*.py" = ["T201", "PLR0915", "PLR0912", "PLR0913", "N803", "N806"]
"tests/*.py" = ["S101"]
