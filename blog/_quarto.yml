project:
  type: website
  render:
    # Render only Quarto documents. Markdown files that live alongside the
    # posts (package docs, READMEs, licenses) are support material rather
    # than blog pages, so they are excluded from the site and its listings.
    - "*.qmd"
    - "posts/**/*.qmd"

website:
  description: "A blog by a technology and math enthusiast!" # Like we have not seen that before.
  site-url: https://galenseilis.github.io/blog/
  title: "Galen's Blog"
  navbar:
    right:
      - presentations.qmd
      - publications.qmd
      - about.qmd
      - icon: github
        href: https://github.com/galenseilis
      - icon: bluesky
        href: https://bsky.app/profile/galen-seilis.bsky.social
format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css



